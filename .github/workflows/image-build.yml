# The one image builder (plan tasks 1a and 1f, operations.md §1): every Frazer
# image is built here, so SLSA Build L3 provenance names this workflow as the
# builder. One image per call; callers use a matrix for several services.
#
#   importpath   build a Go package with ko (every service image)
#   dockerfile   build a Dockerfile with BuildKit instead, for an image that
#                is not one Go package (frazer's Unbound resolver, compiled
#                from checksummed source). working-directory is the build
#                context, and the Dockerfile must lie inside it. BuildKit
#                runs from its image pinned by digest, and every layer
#                file's time and the image's creation time are the commit's,
#                so a Dockerfile whose inputs are pinned gives one image per
#                commit. RUN steps execute on the runner's architecture and
#                nothing here installs emulation: pass the runner's platform
#                in `platforms`, or cross-compile (FROM --platform=$BUILDPLATFORM).
#                A call gives exactly one of importpath and dockerfile.
#
#   push: false  build for every platform, publish nothing (PR checks)
#   push: true   publish by digest, then attach a GitHub build-provenance
#                attestation and a CycloneDX SBOM attestation, and attest the
#                same two predicates again keylessly on Sigstore's public-good
#                instance, logged in Rekor
#   sign: true   also sign with the release key held in OpenBao transit
#                (`hashivault://…`), after logging in to OpenBao with this
#                job's GitHub OIDC token. The key never leaves OpenBao.
#
# Signing goes live in task 1f, when OpenBao and Frazer Registry exist; until
# then callers leave `sign` off.
#
# Why two attestations of each predicate: actions/attest signs a private
# repository's attestations on GitHub's own Sigstore instance, which logs
# nothing in Rekor, and it has no input to choose the instance. frazer-install
# verifies a bundle's Frazer images offline against one trusted root, the
# public-good one, and requires a Rekor inclusion proof (docs
# plan/packaging-core.md §5.2, decision D1 of packaging row 3), so cosign
# attests the predicate actions/attest made, unchanged, on public-good. The
# public Rekor entry names the calling repository, this workflow and the
# commit; the owner accepted that (2026-10-25). The GitHub-instance
# attestations stay, for `gh attestation verify`.
name: image-build

on:
  workflow_call:
    inputs:
      working-directory:
        description: Go module directory (importpath), or the build context (dockerfile), relative to the repository root
        type: string
        default: "."
      runs-on:
        description: Runner label
        type: string
        default: hetzner
      importpath:
        description: Go package to build with ko, for example ./cmd/frazer-api; empty with dockerfile
        type: string
        default: ""
      dockerfile:
        description: >-
          Dockerfile to build with BuildKit instead of ko, relative to
          working-directory, which is the build context and must contain it;
          for example Dockerfile, with working-directory images/unbound.
          Empty (the default) builds importpath with ko
        type: string
        default: ""
      buildkit-version:
        description: BuildKit version, for dockerfile; buildkit-digest must match it
        type: string
        default: v0.34.1
      buildkit-digest:
        description: Digest of docker.io/moby/buildkit:<buildkit-version> (the multi-arch index)
        type: string
        default: sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      repository:
        description: Image repository (ko's KO_DOCKER_REPO with --bare, or BuildKit's image name), for example ghcr.io/frazer-ai/frazer-api
        type: string
        default: ""
      platforms:
        description: Comma-separated platforms
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: Publish the image
        type: boolean
        default: false
      sign:
        description: Sign with the OpenBao transit key (needs push)
        type: boolean
        default: false
      openbao-addr:
        description: OpenBao address, for signing
        type: string
        default: ""
      openbao-auth-path:
        description: OpenBao JWT auth mount for GitHub OIDC
        type: string
        default: jwt-github
      openbao-role:
        description: OpenBao role bound to this workflow (job_workflow_ref)
        type: string
        default: image-build
      cosign-key:
        description: cosign key reference
        type: string
        default: hashivault://frazer-release
      ko-version:
        description: ko version
        type: string
        # renovate: datasource=github-releases depName=ko-build/ko
        default: v0.19.1
      cosign-release:
        description: cosign version
        type: string
        # renovate: datasource=github-releases depName=sigstore/cosign
        default: v3.1.3
      syft-version:
        description: Syft version
        type: string
        # renovate: datasource=github-releases depName=anchore/syft
        default: v1.54.0
    secrets:
      registry-username:
        description: Username for a registry other than ghcr.io
        required: false
      registry-password:
        description: Password or token for a registry other than ghcr.io
        required: false
    outputs:
      image:
        description: The image reference by digest (repository@sha256:…)
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: The image digest
        value: ${{ jobs.build.outputs.digest }}

# No permissions block on purpose: the job inherits the caller's. A PR build
# (push: false) needs only `contents: read`. A publishing caller grants
# `contents: read`, `packages: write` (GHCR), `id-token: write` (attestations,
# public-good signing and OpenBao) and `attestations: write` on the calling
# job.

jobs:
  build:
    name: Build ${{ inputs.importpath || inputs.dockerfile }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check inputs
        env:
          PUSH: ${{ inputs.push }}
          SIGN: ${{ inputs.sign }}
          REPOSITORY: ${{ inputs.repository }}
          OPENBAO_ADDR: ${{ inputs.openbao-addr }}
          IMPORTPATH: ${{ inputs.importpath }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        working-directory: .
        run: |
          if [ "$PUSH" = "true" ] && [ -z "$REPOSITORY" ]; then echo "::error::push needs a repository"; exit 1; fi
          if [ "$SIGN" = "true" ] && [ "$PUSH" != "true" ]; then echo "::error::sign needs push"; exit 1; fi
          if [ "$SIGN" = "true" ] && [ -z "$OPENBAO_ADDR" ]; then echo "::error::sign needs openbao-addr"; exit 1; fi
          if [ -z "${IMPORTPATH}${DOCKERFILE}" ] || { [ -n "$IMPORTPATH" ] && [ -n "$DOCKERFILE" ]; }; then
            echo "::error::give exactly one of importpath and dockerfile"; exit 1
          fi
          # A relative path that stays inside working-directory; the build step
          # checks it again once the files exist, symbolic links resolved.
          if [ -n "$DOCKERFILE" ]; then
            case "/${DOCKERFILE}/" in
              //*|*/../*) echo "::error::dockerfile must be a relative path inside working-directory"; exit 1 ;;
            esac
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.dockerfile == ''
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        if: inputs.dockerfile == ''
        with:
          version: ${{ inputs.ko-version }}
      - name: BuildKit builder
        id: buildkit
        if: inputs.dockerfile != ''
        env:
          BUILDKIT_VERSION: ${{ inputs.buildkit-version }}
          BUILDKIT_DIGEST: ${{ inputs.buildkit-digest }}
        run: |
          set -euo pipefail
          # A builder of its own, named uniquely: a self-hosted runner's Docker
          # daemon may serve other jobs. The last step removes it.
          builder="image-build-$(cat /proc/sys/kernel/random/uuid)"
          docker buildx create --name "$builder" --driver docker-container \
            --driver-opt "image=docker.io/moby/buildkit:${BUILDKIT_VERSION}@${BUILDKIT_DIGEST}" --bootstrap
          echo "builder=${builder}" >> "$GITHUB_OUTPUT"

      - name: Registry login
        if: inputs.push
        env:
          REPOSITORY: ${{ inputs.repository }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          GITHUB_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ secrets.registry-username }}
          REGISTRY_PASSWORD: ${{ secrets.registry-password }}
        run: |
          # Both write the Docker config, which the SBOM step reads too.
          login=(ko login)
          if [ -n "$DOCKERFILE" ]; then login=(docker login); fi
          registry="${REPOSITORY%%/*}"
          if [ "$registry" = "ghcr.io" ]; then
            printf '%s' "$GITHUB_TOKEN" | "${login[@]}" ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          else
            printf '%s' "$REGISTRY_PASSWORD" | "${login[@]}" "$registry" -u "$REGISTRY_USERNAME" --password-stdin
          fi

      - name: Build
        id: build
        env:
          IMPORTPATH: ${{ inputs.importpath }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILDER: ${{ steps.buildkit.outputs.builder }}
          REPOSITORY: ${{ inputs.repository }}
          PLATFORMS: ${{ inputs.platforms }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          repo="${REPOSITORY:-registry.invalid/build-check}"  # not ko.local: that would load into a Docker daemon
          if [ -z "$DOCKERFILE" ]; then
            KO_DOCKER_REPO="$repo" ko build "$IMPORTPATH" --bare --platform="$PLATFORMS" --push="$PUSH" --sbom=none \
              --image-refs=image-refs.txt
            ref=$(head -n1 image-refs.txt)
            digest="${ref##*@}"
          else
            context=$(realpath -e .)
            file=$(realpath -e -- "$DOCKERFILE") || { echo "::error::dockerfile ${DOCKERFILE} does not exist"; exit 1; }
            case "$file" in
              "$context"/*) ;;
              *) echo "::error::dockerfile ${DOCKERFILE} resolves to ${file}, outside working-directory"; exit 1 ;;
            esac
            if [ ! -f "$file" ]; then echo "::error::dockerfile ${DOCKERFILE} is not a file"; exit 1; fi
            # The image's provenance and SBOM are the attestations below, so
            # BuildKit adds none of its own. It pushes the tag ko pushes
            # (latest) and nothing when push is false.
            docker buildx build --builder "$BUILDER" --file "$file" --platform "$PLATFORMS" \
              --build-arg "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" \
              --provenance=false --sbom=false --metadata-file "${RUNNER_TEMP}/buildkit-metadata.json" \
              --output "type=image,name=${repo}:latest,push=${PUSH},rewrite-timestamp=true" "$context"
            digest=$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/buildkit-metadata.json")
          fi
          echo "image=${repo}@${digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Built ${repo}@${digest} for ${PLATFORMS}" >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM
        if: inputs.push
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.build.outputs.image }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          syft-version: ${{ inputs.syft-version }}
          upload-artifact: false
          dependency-snapshot: false

      - name: Provenance attestation
        id: provenance
        if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: SBOM attestation
        id: sbom-attestation
        if: inputs.push
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: sbom.cdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.push
        with:
          cosign-release: ${{ inputs.cosign-release }}

      - name: Public-good attestations
        if: inputs.push
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # Each bundle's DSSE payload is the in-toto statement actions/attest
          # signed. Its predicate goes to cosign attest unchanged: with the
          # predicate type given as a URI, cosign 3.1.3 keeps the predicate's
          # JSON as it is and makes the statement itself, for the image's
          # digest (in-toto Statement v0.1, the subject named by its
          # repository). cosign signs it with this job's OIDC identity
          # (Fulcio, Rekor and the timestamp authority of public-good's
          # signing config), attaches the Sigstore bundle as an OCI referrer
          # and writes it here, where it is verified as frazer-install will:
          # this workflow's identity, the image's digest as the subject, and
          # the Rekor entry. (cosign attest has no flag for a whole statement.)
          hex="${DIGEST#sha256:}"
          for entry in "provenance|$PROVENANCE|https://slsa.dev/provenance/v1" "sbom|$SBOM|https://cyclonedx.org/bom"; do
            IFS='|' read -r name source type <<< "$entry"
            statement="${RUNNER_TEMP}/${name}.intoto.json"
            predicate="${RUNNER_TEMP}/${name}.predicate.json"
            jq -er '.dsseEnvelope.payload' "$source" | base64 -d > "$statement"
            jq -e --arg type "$type" --arg hex "$hex" \
              '.predicateType == $type and (.subject | any(.digest.sha256 == $hex))' "$statement" > /dev/null
            jq -e '.predicate' "$statement" > "$predicate"
            cosign attest --yes --type "$type" --predicate "$predicate" \
              --bundle "${RUNNER_TEMP}/${name}.sigstore.json" "$IMAGE"
            cosign verify-blob-attestation --bundle "${RUNNER_TEMP}/${name}.sigstore.json" \
              --type "$type" --digest "$hex" --digestAlg sha256 \
              --certificate-identity-regexp '^https://github\.com/frazer-ai/\.github/\.github/workflows/image-build\.yml@' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          echo "Signed the provenance and SBOM statements on public-good for ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign with the OpenBao transit key
        if: inputs.sign
        env:
          OPENBAO_ADDR: ${{ inputs.openbao-addr }}
          AUTH_PATH: ${{ inputs.openbao-auth-path }}
          ROLE: ${{ inputs.openbao-role }}
          KEY: ${{ inputs.cosign-key }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=openbao" | jq -r .value)
          token=$(jq -n --arg role "$ROLE" --arg jwt "$jwt" '{role: $role, jwt: $jwt}' |
            curl -sSf -X POST --data @- "${OPENBAO_ADDR}/v1/auth/${AUTH_PATH}/login" | jq -r .auth.client_token)
          echo "::add-mask::${token}"
          # The key is used inside OpenBao; nothing is uploaded to the public
          # transparency log, which would expose the private repository's name.
          VAULT_ADDR="$OPENBAO_ADDR" VAULT_TOKEN="$token" \
            cosign sign --yes --tlog-upload=false --key "$KEY" "$IMAGE"

      - name: Remove the BuildKit builder
        if: always() && steps.buildkit.outputs.builder != ''
        env:
          BUILDER: ${{ steps.buildkit.outputs.builder }}
        run: docker buildx rm "$BUILDER"
