# The one image builder (plan tasks 1a and 1f, operations.md §1): every Frazer
# image is built here, so SLSA Build L3 provenance names this workflow as the
# builder. One image per call; callers use a matrix for several services.
#
#   importpath   build a Go package with ko (every service image)
#   dockerfile   build a Dockerfile with BuildKit instead, for an image that
#                is not one Go package (frazer's Unbound resolver, compiled
#                from checksummed source). working-directory is the build
#                context, and the Dockerfile must lie inside it. BuildKit
#                runs from its image pinned by digest, and every layer
#                file's time and the image's creation time are the commit's,
#                so a Dockerfile whose inputs are pinned gives one image per
#                commit. RUN steps execute on the runner's architecture and
#                nothing here installs emulation: pass the runner's platform
#                in `platforms`, or cross-compile (FROM --platform=$BUILDPLATFORM).
#                A call gives exactly one of importpath and dockerfile.
#
#   push: false  build for every platform, publish nothing (PR checks)
#   push: true   publish by digest only, untagged; attach a GitHub
#                build-provenance attestation and a CycloneDX SBOM
#                attestation, and attest the same two predicates again
#                keylessly on Sigstore's public-good instance, logged in
#                Rekor; then, last, move `tags` (latest) to the digest. A tag
#                therefore never names an image that failed the gate, or one
#                without its attestations and signature. The build writes an
#                OCI layout, which crane pushes by digest: ko pushes nothing
#                without a tag, so neither builder pushes by itself.
#   sign: true   also sign with the release key held in OpenBao transit
#                (`hashivault://…`), after logging in to OpenBao with this
#                job's GitHub OIDC token. The key never leaves OpenBao.
#
#   vulnerability-gate: true
#                Grype checks the image's CycloneDX SBOM against its
#                vulnerability database and fails the job at `fail-on`
#                (high) or above, after the SBOM and before either
#                attestation, the signature or a tag: a published image that
#                fails is pushed by digest but never attested or tagged, so
#                verification and admission refuse it.
#                It runs on a PR build too (push: false), which keeps an OCI
#                layout of the build for Syft, so the PR shows the failure
#                before it merges. Grype scans the SBOM, not the image: the
#                SBOM carries what Syft found plus the image's own CycloneDX
#                fragments (`syft-config` with `+sbom-cataloger`), such as
#                frazer's Unbound, compiled from source, which nothing in the
#                image's package databases names. `grype-config` (ignore
#                rules, each with a reason) and `vex` (OpenVEX: not_affected
#                or fixed) set findings aside. Grype is built with
#                `go install`, so the Go checksum database verifies its
#                source; its database comes from `grype-db-url`, fresh for
#                each job and at most five days old.
#
# Signing goes live in task 1f, when OpenBao and Frazer Registry exist; until
# then callers leave `sign` off.
#
# Why two attestations of each predicate: actions/attest signs a private
# repository's attestations on GitHub's own Sigstore instance, which logs
# nothing in Rekor, and it has no input to choose the instance. frazer-install
# verifies a bundle's Frazer images offline against one trusted root, the
# public-good one, and requires a Rekor inclusion proof (docs
# plan/packaging-core.md §5.2, decision D1 of packaging row 3), so cosign
# attests the predicate actions/attest made, unchanged, on public-good. The
# public Rekor entry names the calling repository, this workflow and the
# commit; the owner accepted that (2026-10-25). The GitHub-instance
# attestations stay, for `gh attestation verify`.
name: image-build

on:
  workflow_call:
    inputs:
      working-directory:
        description: Go module directory (importpath), or the build context (dockerfile), relative to the repository root
        type: string
        default: "."
      runs-on:
        description: Runner label
        type: string
        default: hetzner
      importpath:
        description: Go package to build with ko, for example ./cmd/frazer-api; empty with dockerfile
        type: string
        default: ""
      dockerfile:
        description: >-
          Dockerfile to build with BuildKit instead of ko, relative to
          working-directory, which is the build context and must contain it;
          for example Dockerfile, with working-directory images/unbound.
          Empty (the default) builds importpath with ko
        type: string
        default: ""
      buildkit-version:
        description: BuildKit version, for dockerfile; buildkit-digest must match it
        type: string
        default: v0.34.1
      buildkit-digest:
        description: Digest of docker.io/moby/buildkit:<buildkit-version> (the multi-arch index)
        type: string
        default: sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      repository:
        description: Image repository (ko's KO_DOCKER_REPO with --bare, or BuildKit's image name), for example ghcr.io/frazer-ai/frazer-api
        type: string
        default: ""
      platforms:
        description: Comma-separated platforms
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: Publish the image
        type: boolean
        default: false
      sign:
        description: Sign with the OpenBao transit key (needs push)
        type: boolean
        default: false
      openbao-addr:
        description: OpenBao address, for signing
        type: string
        default: ""
      openbao-auth-path:
        description: OpenBao JWT auth mount for GitHub OIDC
        type: string
        default: jwt-github
      openbao-role:
        description: OpenBao role bound to this workflow (job_workflow_ref)
        type: string
        default: image-build
      cosign-key:
        description: cosign key reference
        type: string
        default: hashivault://frazer-release
      ko-version:
        description: ko version
        type: string
        # renovate: datasource=github-releases depName=ko-build/ko
        default: v0.19.1
      cosign-release:
        description: cosign version
        type: string
        # renovate: datasource=github-releases depName=sigstore/cosign
        default: v3.1.3
      syft-version:
        description: Syft version
        type: string
        # renovate: datasource=github-releases depName=anchore/syft
        default: v1.54.0
      crane-version:
        description: crane version (go-containerregistry), built with go install; it pushes by digest and moves the tags
        type: string
        # renovate: datasource=github-releases depName=google/go-containerregistry
        default: v0.22.1
      tags:
        description: >-
          Tags moved to the image last, with push, once it passed the gate
          and got its attestations; whitespace-separated, empty for none
        type: string
        default: latest
      syft-config:
        description: >-
          Syft configuration file for the SBOM, relative to the repository
          root, for example images/unbound/syft.yaml; empty uses Syft's
          defaults
        type: string
        default: ""
      vulnerability-gate:
        description: >-
          Scan the image's SBOM with Grype, on PR builds too, and fail at
          fail-on or above before anything is attested
        type: boolean
        default: false
      fail-on:
        description: Lowest severity that fails the gate (negligible, low, medium, high or critical)
        type: string
        default: high
      grype-config:
        description: >-
          Grype configuration file (ignore rules, each with a reason),
          relative to the repository root; empty uses none, not even a
          .grype.yaml that Grype would find by itself
        type: string
        default: ""
      vex:
        description: >-
          OpenVEX documents, relative to the repository root and separated by
          whitespace; Grype sets aside what they mark not_affected or fixed
        type: string
        default: ""
      grype-version:
        description: Grype version, built with go install
        type: string
        # renovate: datasource=github-releases depName=anchore/grype
        default: v0.121.0
      grype-db-url:
        description: >-
          Where Grype gets its vulnerability database: a listing's base URL
          (Grype adds /v6/latest.json) or the listing's own URL
        type: string
        default: https://grype.anchore.io/databases
      expect-failure:
        description: >-
          Self-test only. Pass only when the gate fails at fail-on, and then
          attest, sign and tag nothing; needs vulnerability-gate
        type: boolean
        default: false
    secrets:
      registry-username:
        description: Username for a registry other than ghcr.io
        required: false
      registry-password:
        description: Password or token for a registry other than ghcr.io
        required: false
    outputs:
      image:
        description: The image reference by digest (repository@sha256:…)
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: The image digest
        value: ${{ jobs.build.outputs.digest }}
      vulnerabilities:
        description: >-
          The vulnerability IDs the gate reported, space-separated; empty
          when it found none or did not run
        value: ${{ jobs.build.outputs.vulnerabilities }}
      ignored-vulnerabilities:
        description: The vulnerability IDs that grype-config or vex set aside, space-separated
        value: ${{ jobs.build.outputs.ignored-vulnerabilities }}

# No permissions block on purpose: the job inherits the caller's. A PR build
# (push: false) needs only `contents: read`. A publishing caller grants
# `contents: read`, `packages: write` (GHCR), `id-token: write` (attestations,
# public-good signing and OpenBao) and `attestations: write` on the calling
# job.

jobs:
  build:
    name: Build ${{ inputs.importpath || inputs.dockerfile }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      vulnerabilities: ${{ steps.gate.outputs.vulnerabilities }}
      ignored-vulnerabilities: ${{ steps.gate.outputs.ignored-vulnerabilities }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check inputs
        env:
          PUSH: ${{ inputs.push }}
          SIGN: ${{ inputs.sign }}
          REPOSITORY: ${{ inputs.repository }}
          OPENBAO_ADDR: ${{ inputs.openbao-addr }}
          IMPORTPATH: ${{ inputs.importpath }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          GATE: ${{ inputs.vulnerability-gate }}
          EXPECT_FAILURE: ${{ inputs.expect-failure }}
          FAIL_ON: ${{ inputs.fail-on }}
          SYFT_CONFIG: ${{ inputs.syft-config }}
          GRYPE_CONFIG: ${{ inputs.grype-config }}
          VEX: ${{ inputs.vex }}
          TAGS: ${{ inputs.tags }}
        working-directory: .
        run: |
          if [ "$PUSH" = "true" ] && [ -z "$REPOSITORY" ]; then echo "::error::push needs a repository"; exit 1; fi
          if [ "$SIGN" = "true" ] && [ "$PUSH" != "true" ]; then echo "::error::sign needs push"; exit 1; fi
          if [ "$SIGN" = "true" ] && [ -z "$OPENBAO_ADDR" ]; then echo "::error::sign needs openbao-addr"; exit 1; fi
          if [ -z "${IMPORTPATH}${DOCKERFILE}" ] || { [ -n "$IMPORTPATH" ] && [ -n "$DOCKERFILE" ]; }; then
            echo "::error::give exactly one of importpath and dockerfile"; exit 1
          fi
          # A relative path that stays inside working-directory; the build step
          # checks it again once the files exist, symbolic links resolved.
          if [ -n "$DOCKERFILE" ]; then
            case "/${DOCKERFILE}/" in
              //*|*/../*) echo "::error::dockerfile must be a relative path inside working-directory"; exit 1 ;;
            esac
          fi
          # The gate's settings take effect only with the gate, so a caller
          # never believes in a gate that does not run.
          if [ "$GATE" != "true" ] && [ -n "${GRYPE_CONFIG}${VEX}" ]; then
            echo "::error::grype-config and vex need vulnerability-gate"; exit 1
          fi
          if [ "$EXPECT_FAILURE" = "true" ] && [ "$GATE" != "true" ]; then
            echo "::error::expect-failure needs vulnerability-gate"; exit 1
          fi
          read -r -d '' -a tags <<< "$TAGS" || true
          for tag in "${tags[@]}"; do
            if ! [[ $tag =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then echo "::error::${tag} is not a valid tag"; exit 1; fi
          done
          if [ "$GATE" = "true" ]; then
            case "$FAIL_ON" in
              negligible|low|medium|high|critical) ;;
              *) echo "::error::fail-on must be negligible, low, medium, high or critical"; exit 1 ;;
            esac
          fi
          # Configuration files are relative paths inside the repository.
          read -r -d '' -a files <<< "${SYFT_CONFIG} ${GRYPE_CONFIG} ${VEX}" || true
          for file in "${files[@]}"; do
            case "/${file}/" in
              //*|*/../*) echo "::error::${file}: syft-config, grype-config and vex are relative paths inside the repository"; exit 1 ;;
            esac
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.dockerfile == ''
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        if: inputs.dockerfile == ''
        with:
          version: ${{ inputs.ko-version }}
      - name: BuildKit builder
        id: buildkit
        if: inputs.dockerfile != ''
        env:
          BUILDKIT_VERSION: ${{ inputs.buildkit-version }}
          BUILDKIT_DIGEST: ${{ inputs.buildkit-digest }}
        run: |
          set -euo pipefail
          # A builder of its own, named uniquely: a self-hosted runner's Docker
          # daemon may serve other jobs. The last step removes it, also when
          # it was created but failed to start, so its name is recorded first.
          builder="image-build-$(cat /proc/sys/kernel/random/uuid)"
          echo "builder=${builder}" >> "$GITHUB_OUTPUT"
          docker buildx create --name "$builder" --driver docker-container \
            --driver-opt "image=docker.io/moby/buildkit:${BUILDKIT_VERSION}@${BUILDKIT_DIGEST}" --bootstrap

      - name: Registry login
        if: inputs.push
        env:
          REPOSITORY: ${{ inputs.repository }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          GITHUB_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ secrets.registry-username }}
          REGISTRY_PASSWORD: ${{ secrets.registry-password }}
        run: |
          # Both write the Docker config, which crane and the SBOM step read.
          login=(ko login)
          if [ -n "$DOCKERFILE" ]; then login=(docker login); fi
          registry="${REPOSITORY%%/*}"
          if [ "$registry" = "ghcr.io" ]; then
            printf '%s' "$GITHUB_TOKEN" | "${login[@]}" ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          else
            printf '%s' "$REGISTRY_PASSWORD" | "${login[@]}" "$registry" -u "$REGISTRY_USERNAME" --password-stdin
          fi

      - name: Build
        id: build
        env:
          IMPORTPATH: ${{ inputs.importpath }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILDER: ${{ steps.buildkit.outputs.builder }}
          REPOSITORY: ${{ inputs.repository }}
          PLATFORMS: ${{ inputs.platforms }}
          PUSH: ${{ inputs.push }}
          GATE: ${{ inputs.vulnerability-gate }}
        run: |
          set -euo pipefail
          repo="${REPOSITORY:-registry.invalid/build-check}"  # not ko.local: that would load into a Docker daemon
          # Neither builder pushes: with push, or with the gate, the build
          # writes the image as an OCI layout, which the next steps push by
          # digest or give Syft. The image and its digest are the same as
          # without it.
          layout=""
          if [ "$PUSH" = "true" ] || [ "$GATE" = "true" ]; then
            layout="${RUNNER_TEMP}/image-layout"
            echo "layout=${layout}" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$DOCKERFILE" ]; then
            # ko names the layout like a repository, so its path must be one.
            if [ -n "$layout" ] && ! [[ $layout =~ ^[a-z0-9_./-]+$ ]]; then
              echo "::error::ko writes an OCI layout only to a path of lowercase letters, digits and _-./, not ${layout}"; exit 1
            fi
            KO_DOCKER_REPO="$repo" ko build "$IMPORTPATH" --bare --platform="$PLATFORMS" --push=false --sbom=none \
              --image-refs=image-refs.txt ${layout:+"--oci-layout-path=${layout}"}
            ref=$(head -n1 image-refs.txt)
            digest="${ref##*@}"
          else
            context=$(realpath -e .)
            file=$(realpath -e -- "$DOCKERFILE") || { echo "::error::dockerfile ${DOCKERFILE} does not exist"; exit 1; }
            case "$file" in
              "$context"/*) ;;
              *) echo "::error::dockerfile ${DOCKERFILE} resolves to ${file}, outside working-directory"; exit 1 ;;
            esac
            if [ ! -f "$file" ]; then echo "::error::dockerfile ${DOCKERFILE} is not a file"; exit 1; fi
            # The image's provenance and SBOM are the attestations below, so
            # BuildKit adds none of its own.
            output="type=image,name=${repo}:latest,push=false,rewrite-timestamp=true"
            if [ -n "$layout" ]; then output="type=oci,dest=${layout},tar=false,rewrite-timestamp=true"; fi
            docker buildx build --builder "$BUILDER" --file "$file" --platform "$PLATFORMS" \
              --build-arg "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" \
              --provenance=false --sbom=false --metadata-file "${RUNNER_TEMP}/buildkit-metadata.json" \
              --output "$output" "$context"
            digest=$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/buildkit-metadata.json")
          fi
          echo "image=${repo}@${digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Built ${repo}@${digest} for ${PLATFORMS}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.push || inputs.vulnerability-gate
        with:
          go-version: stable
          cache: false

      - name: Install crane and Grype
        if: inputs.push || inputs.vulnerability-gate
        working-directory: .
        env:
          PUSH: ${{ inputs.push }}
          GATE: ${{ inputs.vulnerability-gate }}
          CRANE_VERSION: ${{ inputs.crane-version }}
          GRYPE_VERSION: ${{ inputs.grype-version }}
        run: |
          set -euo pipefail
          # Built from source that the Go checksum database verifies, in
          # module and build caches of their own: nothing restored or left
          # by another job on the runner goes into either tool.
          bin="${RUNNER_TEMP}/tools-bin"
          export GOBIN="$bin" GOMODCACHE="${RUNNER_TEMP}/tools-gomodcache" GOCACHE="${RUNNER_TEMP}/tools-gocache" \
            GOFLAGS=-modcacherw GOWORK=off
          if [ "$PUSH" = "true" ]; then
            go install "github.com/google/go-containerregistry/cmd/crane@${CRANE_VERSION}"
          fi
          if [ "$GATE" = "true" ]; then
            go install -ldflags "-X main.version=${GRYPE_VERSION#v}" "github.com/anchore/grype/cmd/grype@${GRYPE_VERSION}"
          fi
          echo "$bin" >> "$GITHUB_PATH"

      # By digest only: a reference with a digest makes crane push no tag.
      # crane pushes the layout's one entry (the index, or the image) and
      # prints the digest it pushed, which must be the build's.
      - name: Push by digest
        if: inputs.push
        working-directory: .
        env:
          REPOSITORY: ${{ inputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          LAYOUT: ${{ steps.build.outputs.layout }}
        run: |
          set -euo pipefail
          pushed=$(crane push "$LAYOUT" "${REPOSITORY}@${DIGEST}")
          if [ "${pushed##*@}" != "$DIGEST" ]; then
            echo "::error::crane pushed ${pushed}, not the build's ${DIGEST}"; exit 1
          fi
          echo "Pushed ${pushed}, untagged" >> "$GITHUB_STEP_SUMMARY"

      # On push, Syft reads the published image, and this SBOM is the one
      # attested below. A PR build with the gate gives Syft the OCI layout of
      # the same build. Of a multi-platform image, both read the runner's
      # platform.
      - name: SBOM
        if: inputs.push || inputs.vulnerability-gate
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.push && steps.build.outputs.image || format('oci-dir:{0}', steps.build.outputs.layout) }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          syft-version: ${{ inputs.syft-version }}
          config: ${{ inputs.syft-config }}
          upload-artifact: false
          dependency-snapshot: false

      # Grype's exit status: 0 nothing at fail-on or above, 2 something is,
      # anything else an error (no database, an unreadable file), which
      # fails the gate in either mode.
      - name: Vulnerability gate
        id: gate
        if: inputs.vulnerability-gate
        working-directory: .
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          CONFIG: ${{ inputs.grype-config }}
          VEX: ${{ inputs.vex }}
          EXPECT_FAILURE: ${{ inputs.expect-failure }}
          # The database: from grype-db-url, into a directory of this job's
          # own, checked against the listing on every run and refused when
          # the listing cannot be read or the database is more than five
          # days old. Set here, so a grype-config cannot change them.
          GRYPE_DB_UPDATE_URL: ${{ inputs.grype-db-url }}
          GRYPE_DB_AUTO_UPDATE: "true"
          GRYPE_DB_MAX_UPDATE_CHECK_FREQUENCY: 0s
          GRYPE_DB_REQUIRE_UPDATE_CHECK: "true"
          GRYPE_DB_VALIDATE_AGE: "true"
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 120h
          GRYPE_DB_VALIDATE_BY_HASH_ON_START: "true"
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          export GRYPE_DB_CACHE_DIR="${RUNNER_TEMP}/grype-db"
          # Grype searches the working directory and the home directory for
          # a configuration when given none, so it always gets one: the
          # caller's, or an empty file.
          config="${RUNNER_TEMP}/grype-no-config.yaml"
          if [ -n "$CONFIG" ]; then config="$CONFIG"; else : > "$config"; fi
          read -r -d '' -a vex_files <<< "$VEX" || true
          for file in "$config" "${vex_files[@]}"; do
            if [ ! -f "$file" ]; then echo "::error::${file} does not exist"; exit 1; fi
          done
          args=(--config "$config" --fail-on "$FAIL_ON" --output table --output "json=${RUNNER_TEMP}/grype.json")
          for file in "${vex_files[@]}"; do args+=(--vex "$file"); done

          set +e
          grype sbom:sbom.cdx.json "${args[@]}"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::Grype did not complete (exit status ${code}); see its log above"; exit 1
          fi
          # Every later step checks this, so nothing is attested, signed or
          # tagged after a failed gate, also under expect-failure.
          if [ "$code" -eq 2 ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; fi

          report="${RUNNER_TEMP}/grype.json"
          found=$(jq -r '[.matches[].vulnerability.id] | unique | join(" ")' "$report")
          ignored=$(jq -r '[(.ignoredMatches // [])[].vulnerability.id] | unique | join(" ")' "$report")
          echo "vulnerabilities=${found}" >> "$GITHUB_OUTPUT"
          echo "ignored-vulnerabilities=${ignored}" >> "$GITHUB_OUTPUT"
          {
            jq -r '.descriptor.db.status | "Grype database built \(.built), from \(.from | split("?")[0])"' "$report"
            echo
            echo "| Vulnerability | Severity | Package | Version | Fixed in |"
            echo "|---|---|---|---|---|"
            jq -r '.matches[] | "| \(.vulnerability.id) | \(.vulnerability.severity) | \(.artifact.name) | \(.artifact.version) | \((.vulnerability.fix.versions // []) | join(", ")) |"' "$report"
            echo
            echo "Set aside by grype-config or vex: ${ignored:-none}"
            jq -r '(.ignoredMatches // [])[] | "- \(.vulnerability.id) in \(.artifact.name) \(.artifact.version): \([.appliedIgnoreRules[] | .reason // "vex \(.["vex-status"]) \(.["vex-justification"] // "")"] | join("; "))"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$EXPECT_FAILURE" = "true" ]; then
            if [ "$code" -eq 2 ]; then echo "The gate failed at ${FAIL_ON} or above, as expected."; exit 0; fi
            echo "::error::expected the gate to fail at ${FAIL_ON} or above"; exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::error::the image has vulnerabilities at ${FAIL_ON} or above (see the table above), so it gets no attestations and no tag. Upgrade the component, or set the finding aside in vex or grype-config with a reason"
            exit 1
          fi

      - name: Provenance attestation
        id: provenance
        if: inputs.push && steps.gate.outputs.failed != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: SBOM attestation
        id: sbom-attestation
        if: inputs.push && steps.gate.outputs.failed != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: sbom.cdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.push && steps.gate.outputs.failed != 'true'
        with:
          cosign-release: ${{ inputs.cosign-release }}

      - name: Public-good attestations
        if: inputs.push && steps.gate.outputs.failed != 'true'
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # Each bundle's DSSE payload is the in-toto statement actions/attest
          # signed. Its predicate goes to cosign attest unchanged: with the
          # predicate type given as a URI, cosign 3.1.3 keeps the predicate's
          # JSON as it is and makes the statement itself, for the image's
          # digest (in-toto Statement v0.1, the subject named by its
          # repository). cosign signs it with this job's OIDC identity
          # (Fulcio, Rekor and the timestamp authority of public-good's
          # signing config), attaches the Sigstore bundle as an OCI referrer
          # and writes it here, where it is verified as frazer-install will:
          # this workflow's identity, the image's digest as the subject, and
          # the Rekor entry. (cosign attest has no flag for a whole statement.)
          hex="${DIGEST#sha256:}"
          for entry in "provenance|$PROVENANCE|https://slsa.dev/provenance/v1" "sbom|$SBOM|https://cyclonedx.org/bom"; do
            IFS='|' read -r name source type <<< "$entry"
            statement="${RUNNER_TEMP}/${name}.intoto.json"
            predicate="${RUNNER_TEMP}/${name}.predicate.json"
            jq -er '.dsseEnvelope.payload' "$source" | base64 -d > "$statement"
            jq -e --arg type "$type" --arg hex "$hex" \
              '.predicateType == $type and (.subject | any(.digest.sha256 == $hex))' "$statement" > /dev/null
            jq -e '.predicate' "$statement" > "$predicate"
            cosign attest --yes --type "$type" --predicate "$predicate" \
              --bundle "${RUNNER_TEMP}/${name}.sigstore.json" "$IMAGE"
            cosign verify-blob-attestation --bundle "${RUNNER_TEMP}/${name}.sigstore.json" \
              --type "$type" --digest "$hex" --digestAlg sha256 \
              --certificate-identity-regexp '^https://github\.com/frazer-ai/\.github/\.github/workflows/image-build\.yml@' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          echo "Signed the provenance and SBOM statements on public-good for ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign with the OpenBao transit key
        if: inputs.sign && steps.gate.outputs.failed != 'true'
        env:
          OPENBAO_ADDR: ${{ inputs.openbao-addr }}
          AUTH_PATH: ${{ inputs.openbao-auth-path }}
          ROLE: ${{ inputs.openbao-role }}
          KEY: ${{ inputs.cosign-key }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=openbao" | jq -r .value)
          token=$(jq -n --arg role "$ROLE" --arg jwt "$jwt" '{role: $role, jwt: $jwt}' |
            curl -sSf -X POST --data @- "${OPENBAO_ADDR}/v1/auth/${AUTH_PATH}/login" | jq -r .auth.client_token)
          echo "::add-mask::${token}"
          # The key is used inside OpenBao; nothing is uploaded to the public
          # transparency log, which would expose the private repository's name.
          VAULT_ADDR="$OPENBAO_ADDR" VAULT_TOKEN="$token" \
            cosign sign --yes --tlog-upload=false --key "$KEY" "$IMAGE"

      # Last: the tags move only to an image that passed the gate (when it
      # runs) and got its attestations and signature. crane tag puts the
      # digest's own manifest under each tag, so each tag names the digest.
      - name: Tag
        if: inputs.push && steps.gate.outputs.failed != 'true'
        working-directory: .
        env:
          REPOSITORY: ${{ inputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          read -r -d '' -a tags <<< "$TAGS" || true
          for tag in "${tags[@]}"; do
            crane tag "${REPOSITORY}@${DIGEST}" "$tag"
            echo "Tagged ${REPOSITORY}:${tag} as ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Remove the BuildKit builder
        if: always() && steps.buildkit.outputs.builder != ''
        env:
          BUILDER: ${{ steps.buildkit.outputs.builder }}
        run: |
          # Absent when creating it failed before it was registered.
          if docker buildx inspect "$BUILDER" >/dev/null 2>&1; then docker buildx rm "$BUILDER"; fi
