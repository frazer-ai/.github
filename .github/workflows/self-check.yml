# Checks this repository: lints every workflow, validates the Renovate
# config, and runs each shared workflow against the fixtures in testdata/,
# including runs that must fail (the licence gate, the scanners, the names
# gate and image-build's vulnerability gate). `required` is the one check
# the ruleset requires (repositories.md §9.4).
name: self-check

on:
  pull_request:
    # edited: a fixed PR title reruns the names gate.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: actionlint, zizmor, Renovate config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: actionlint
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: v1.7.12
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          # renovate: datasource=pypi depName=zizmor
          version: 1.30.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Renovate config
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.132.2
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict renovate.json renovate-config.json

  go:
    uses: ./.github/workflows/go-check.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/go
      artifact-name: go-fixture-test-report

  web:
    uses: ./.github/workflows/web-check.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/web

  tofu:
    uses: ./.github/workflows/tofu-check.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/tofu

  image:
    uses: ./.github/workflows/image-build.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/go
      importpath: ./cmd/hello

  # The publishing path, which `image` (push: false) skips: the fixture
  # image pushed to GHCR, its provenance and SBOM attested by actions/attest
  # and signed again on public-good by cosign, which verifies its bundles.
  # Not on a fork's pull request, whose token can neither write packages nor
  # mint an OIDC token.
  image-publish:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-build.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/go
      importpath: ./cmd/hello
      repository: ghcr.io/frazer-ai/image-build-selftest
      platforms: linux/amd64
      push: true
      # latest, and a tag of this run's own that image-gate-tags checks.
      tags: latest selftest-${{ github.run_id }}-${{ github.run_attempt }}-ko

  # A PR build (push: false) on a base image that is a private ghcr.io
  # package: testdata/private-base's .ko.yaml takes the image image-publish
  # just pushed, which this repository's workflows may read. ko pulls it
  # with the login every build makes and this job's `packages: read`.
  image-private-base:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: image-publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/image-build.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/private-base
      importpath: .
      platforms: linux/amd64

  # Its control: a token without `packages: read` gets no manifest of that
  # base, so image-private-base passes through its grant and the login, not
  # because the package is public.
  image-private-base-refused:
    name: The private base is refused without packages read
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: image-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: No manifest without packages read
        env:
          REPOSITORY: frazer-ai/image-build-selftest
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GHCR may refuse the pull token itself, or issue one that the
          # manifest then refuses; either is the refusal. A network error
          # fails the step.
          code=$(curl -sS -o "$RUNNER_TEMP/token.json" -w '%{http_code}' -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPOSITORY}:pull")
          auth=()
          if [ "$code" = "200" ]; then
            token=$(jq -r '.token // empty' "$RUNNER_TEMP/token.json")
            if [ -n "$token" ]; then
              echo "::add-mask::${token}"
              auth=(-H "Authorization: Bearer ${token}")
            fi
          fi
          rm -f "$RUNNER_TEMP/token.json"
          accept="application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json"
          status=$(curl -sS -o /dev/null -I "${auth[@]}" -H "Accept: ${accept}" \
            -w '%{http_code}' "https://ghcr.io/v2/${REPOSITORY}/manifests/latest")
          case "$status" in
            401|403|404) echo "refused: the token request answered ${code}, the manifest ${status}, as required" ;;
            200) echo "::error::ghcr.io/${REPOSITORY}:latest was served to a token without packages read"; exit 1 ;;
            *) echo "::error::the manifest request answered ${status}, neither a refusal nor the image"; exit 1 ;;
          esac

  # The dockerfile mode: BuildKit instead of ko, testdata/docker for both
  # platforms (the fixture runs nothing, so it needs no emulation).
  image-dockerfile:
    uses: ./.github/workflows/image-build.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/docker
      dockerfile: Dockerfile

  # The dockerfile mode's publishing path, to the same test package as
  # image-publish, and on the same events.
  image-dockerfile-publish:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-build.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/docker
      dockerfile: Dockerfile
      repository: ghcr.io/frazer-ai/image-build-selftest
      platforms: linux/amd64
      push: true

  # The vulnerability gate on a PR build (push: false): ko's fixture, for
  # both platforms, read from the build's OCI layout. Nothing in it is at or
  # above high.
  image-gate:
    uses: ./.github/workflows/image-build.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/go
      importpath: ./cmd/hello
      vulnerability-gate: true

  # The gate must fail: testdata/image-vuln declares Unbound 1.26.0 in a
  # CycloneDX fragment, which Syft reads only through syft-config. Its VEX
  # document and its grype-config each set one finding aside, and
  # image-gate-findings checks all three by ID.
  image-gate-must-fail:
    uses: ./.github/workflows/image-build.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/image-vuln
      dockerfile: Dockerfile
      syft-config: testdata/image-vuln/syft.yaml
      vulnerability-gate: true
      grype-config: testdata/image-vuln/grype.yaml
      vex: testdata/image-vuln/vex.openvex.json
      expect-failure: true

  image-gate-findings:
    name: The gate's findings on testdata/image-vuln
    needs: image-gate-must-fail
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reported CVE-2026-81642, set aside CVE-2026-97206 (vex) and CVE-2026-82717 (grype-config)
        env:
          FOUND: ${{ needs.image-gate-must-fail.outputs.vulnerabilities }}
          IGNORED: ${{ needs.image-gate-must-fail.outputs.ignored-vulnerabilities }}
        run: |
          echo "reported: ${FOUND}"
          echo "set aside: ${IGNORED}"
          has() { case " $1 " in *" $2 "*) return 0 ;; esac; return 1; }
          fail=0
          if ! has "$FOUND" CVE-2026-81642; then echo "::error::CVE-2026-81642 was not reported"; fail=1; fi
          for id in CVE-2026-97206 CVE-2026-82717; do
            if has "$FOUND" "$id" || ! has "$IGNORED" "$id"; then echo "::error::${id} was not set aside"; fail=1; fi
          done
          exit "$fail"

  # The publishing path with the gate: testdata/docker passes it, then gets
  # its attestations and a tag of this run's own, as in
  # image-dockerfile-publish.
  image-gate-publish:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-build.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/docker
      dockerfile: Dockerfile
      repository: ghcr.io/frazer-ai/image-build-selftest
      platforms: linux/amd64
      push: true
      vulnerability-gate: true
      tags: selftest-${{ github.run_id }}-${{ github.run_attempt }}-dockerfile

  # The publishing path of an image that fails the gate, with BuildKit and
  # with ko (testdata/image-vuln/ko carries the same fragment in kodata/):
  # each is pushed by digest, and must get no attestation and not the tag
  # of this run's own it asks for. Same permissions as the passing jobs, so
  # a regression would attest or tag, and image-gate-tags would see it.
  image-gate-must-fail-publish:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-build.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/image-vuln
      dockerfile: Dockerfile
      repository: ghcr.io/frazer-ai/image-build-selftest
      push: true
      syft-config: testdata/image-vuln/syft.yaml
      vulnerability-gate: true
      expect-failure: true
      tags: selftest-${{ github.run_id }}-${{ github.run_attempt }}-must-fail-dockerfile

  image-gate-must-fail-publish-ko:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-build.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/image-vuln/ko
      importpath: .
      repository: ghcr.io/frazer-ai/image-build-selftest
      push: true
      syft-config: testdata/image-vuln/syft.yaml
      vulnerability-gate: true
      expect-failure: true
      tags: selftest-${{ github.run_id }}-${{ github.run_attempt }}-must-fail-ko

  # Reads the registry and GitHub's attestations, not the jobs' own word:
  # the two images that failed the gate are in the registry by digest, with
  # neither their run tag nor an attestation; the passing jobs' run tags
  # name their digests, which have attestations (the control).
  image-gate-tags:
    name: Tags and attestations only on images that passed the gate
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [image-publish, image-gate-publish, image-gate-must-fail-publish, image-gate-must-fail-publish-ko]
    permissions:
      contents: read
      packages: read
      attestations: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the registry and the attestations
        env:
          REPOSITORY: frazer-ai/image-build-selftest
          RUN_TAG: selftest-${{ github.run_id }}-${{ github.run_attempt }}
          PASS_KO: ${{ needs.image-publish.outputs.digest }}
          PASS_DOCKERFILE: ${{ needs.image-gate-publish.outputs.digest }}
          FAIL_DOCKERFILE: ${{ needs.image-gate-must-fail-publish.outputs.digest }}
          FAIL_KO: ${{ needs.image-gate-must-fail-publish-ko.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token=$(curl -sSf -u "x:${GH_TOKEN}" "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPOSITORY}:pull" | jq -er .token)
          echo "::add-mask::${token}"
          accept="application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json"
          # The HTTP status of a tag or digest, and the digest it names.
          manifest() {
            curl -sS -o /dev/null -I -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" \
              -w '%{http_code} %header{docker-content-digest}' "https://ghcr.io/v2/${REPOSITORY}/manifests/$1"
          }
          # 0 when the digest has attestations, 1 when GitHub has none (404).
          attested() {
            local out
            if out=$(gh api "repos/${GITHUB_REPOSITORY}/attestations/$1" --jq '.attestations | length' 2>&1); then
              [ "$out" -gt 0 ]; return
            fi
            if grep -q 'HTTP 404' <<< "$out"; then return 1; fi
            echo "::error::could not list the attestations of $1: ${out}"; exit 1
          }
          fail=0
          check() { if [ "$2" = "$3" ]; then echo "ok: $1"; else echo "::error::$1: expected '$3', got '$2'"; fail=1; fi; }
          for name in KO DOCKERFILE; do
            pass="PASS_${name}" bad="FAIL_${name}" kind=$(tr '[:upper:]' '[:lower:]' <<< "$name")
            check "the passing ${kind} image's run tag names it" "$(manifest "${RUN_TAG}-${kind}")" "200 ${!pass}"
            if attested "${!pass}"; then echo "ok: the passing ${kind} image is attested"; else echo "::error::the passing ${kind} image has no attestation"; fail=1; fi
            check "the failing ${kind} image is in the registry by digest" "$(manifest "${!bad}")" "200 ${!bad}"
            check "the failing ${kind} image's run tag does not exist" "$(manifest "${RUN_TAG}-must-fail-${kind}" | cut -d' ' -f1)" "404"
            if attested "${!bad}"; then echo "::error::the failing ${kind} image has attestations"; fail=1; else echo "ok: the failing ${kind} image has no attestation"; fi
          done
          exit "$fail"

  licences:
    uses: ./.github/workflows/license-gate.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/go
      artifact-name: license-gate-go-fixture

  # A pnpm lockfile: the licence comes from the npm registry, not the lock.
  licences-js:
    uses: ./.github/workflows/license-gate.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/license-js
      artifact-name: license-gate-js-fixture

  licences-must-fail:
    uses: ./.github/workflows/license-gate.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/license-bad
      artifact-name: license-gate-bad-fixture
      expect-failure: true

  scan:
    uses: ./.github/workflows/scan.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/go

  scan-must-fail:
    uses: ./.github/workflows/scan.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/vuln
      expect-failure: true

  names:
    uses: ./.github/workflows/names.yml
    with:
      runs-on: ubuntu-24.04
      exclude: ^testdata/names-bad/

  names-must-fail:
    uses: ./.github/workflows/names.yml
    with:
      runs-on: ubuntu-24.04
      working-directory: testdata/names-bad
      expect-failure: true

  required:
    name: required
    if: always()
    needs: [workflows, go, web, tofu, image, image-publish, image-private-base, image-private-base-refused, image-dockerfile, image-dockerfile-publish, image-gate, image-gate-must-fail, image-gate-findings, image-gate-publish, image-gate-must-fail-publish, image-gate-must-fail-publish-ko, image-gate-tags, licences, licences-js, licences-must-fail, scan, scan-must-fail, names, names-must-fail]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          # Every check passed; the publishing jobs, the private-base jobs and image-gate-tags may be skipped only for a fork.
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS" | jq -e --argjson fork "$FORK" \
            'to_entries | all(.value.result == "success" or ((.key | IN("image-publish", "image-private-base", "image-private-base-refused", "image-dockerfile-publish", "image-gate-publish", "image-gate-must-fail-publish", "image-gate-must-fail-publish-ko", "image-gate-tags")) and $fork and .value.result == "skipped"))' > /dev/null; then
            echo "::error::a required check did not pass"
            exit 1
          fi
