# OpenTofu gate (plan task 1a, infrastructure-as-code.md): format, validate,
# lint, scan and test every root and module under the working directory,
# without credentials and without a backend. `tofu plan` with read-only
# credentials stays in the infra repository's own workflow.
name: tofu-check

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to check, relative to the repository root
        type: string
        default: "."
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-24.04
      tofu-version:
        description: OpenTofu version
        type: string
        # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.+)$
        default: 1.13.1
      tflint-version:
        description: TFLint version
        type: string
        # renovate: datasource=github-releases depName=terraform-linters/tflint
        default: v0.64.0
      trivy-version:
        description: Trivy version
        type: string
        # renovate: datasource=github-releases depName=aquasecurity/trivy
        default: v0.75.0
      trivy-severity:
        description: Trivy severities that fail the gate
        type: string
        default: HIGH,CRITICAL

permissions:
  contents: read

jobs:
  check:
    name: fmt, validate, tflint, trivy, test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ inputs.tflint-version }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ inputs.trivy-version }} # zizmor: ignore[unpinned-tools] pinned by the input default
          cache: true
      - name: tofu fmt
        run: tofu fmt -check -recursive -diff
      - name: tofu init and validate
        run: |
          set -euo pipefail
          find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u | while read -r dir; do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false -no-color
            tofu -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done
      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact
      - name: trivy config
        env:
          SEVERITY: ${{ inputs.trivy-severity }}
        run: trivy config --exit-code 1 --severity "$SEVERITY" .
      - name: tofu test
        run: |
          set -euo pipefail
          find . \( -name '*.tftest.hcl' -o -name '*.tofutest.hcl' \) -not -path '*/.terraform/*' \
            -exec dirname {} \; | sed 's#/tests$##' | sort -u | while read -r dir; do
            echo "::group::$dir"
            tofu -chdir="$dir" test -no-color
            echo "::endgroup::"
          done
