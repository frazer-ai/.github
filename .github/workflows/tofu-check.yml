# OpenTofu gate (plan task 1a, infrastructure-as-code.md): format, validate,
# lint, scan and test every root and module under the working directory,
# without credentials and without a backend. `tofu plan` with read-only
# credentials stays in the infra repository's own workflow.
name: tofu-check

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to check, relative to the repository root
        type: string
        default: "."
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-24.04
      tofu-version:
        description: OpenTofu version
        type: string
        # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.+)$
        default: 1.13.1
      tflint-version:
        description: TFLint version
        type: string
        # renovate: datasource=github-releases depName=terraform-linters/tflint
        default: v0.64.0
      trivy-version:
        description: Trivy version; the image digest and signing identity must match it
        type: string
        default: 0.75.0
      trivy-digest:
        description: Digest of ghcr.io/aquasecurity/trivy:<trivy-version> (the multi-arch index)
        type: string
        default: sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
      cosign-release:
        description: cosign version, to verify the Trivy image
        type: string
        # renovate: datasource=github-releases depName=sigstore/cosign
        default: v3.1.3
      trivy-severity:
        description: Trivy severities that fail the gate
        type: string
        default: HIGH,CRITICAL

permissions:
  contents: read

jobs:
  check:
    name: fmt, validate, tflint, trivy, test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ inputs.tflint-version }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ inputs.cosign-release }}
      # Trivy runs from its image pinned by digest, after cosign verifies the
      # signature against Aqua's release workflow (as in scan.yml).
      - name: Install Trivy (digest-pinned, signature verified)
        env:
          TRIVY_VERSION: ${{ inputs.trivy-version }}
          TRIVY_DIGEST: ${{ inputs.trivy-digest }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$bin" "$RUNNER_TEMP/trivy-cache"
          image="ghcr.io/aquasecurity/trivy@${TRIVY_DIGEST}"
          cosign verify "$image" \
            --certificate-identity "https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/v${TRIVY_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cat > "$bin/trivy" <<SH
          #!/usr/bin/env bash
          exec docker run --rm -v "\$PWD:/src:ro" -w /src -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$image" "\$@"
          SH
          chmod +x "$bin/trivy"
          echo "$bin" >> "$GITHUB_PATH"
      - name: tofu fmt
        run: tofu fmt -check -recursive -diff
      - name: tofu init and validate
        run: |
          set -euo pipefail
          find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u | while read -r dir; do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false -no-color
            tofu -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done
      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact
      - name: trivy config
        env:
          SEVERITY: ${{ inputs.trivy-severity }}
        run: trivy config --exit-code 1 --severity "$SEVERITY" .
      - name: tofu test
        run: |
          set -euo pipefail
          find . \( -name '*.tftest.hcl' -o -name '*.tofutest.hcl' \) -not -path '*/.terraform/*' \
            -exec dirname {} \; | sed 's#/tests$##' | sort -u | while read -r dir; do
            echo "::group::$dir"
            tofu -chdir="$dir" test -no-color
            echo "::endgroup::"
          done
