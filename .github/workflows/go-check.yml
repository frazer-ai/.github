# Go gate (plan task 1a): the same checks for every Go module, called by the
# pull-request workflow and by the release workflow, so "the release ran what
# the PR ran" is true by construction (Vektor's testing/gates.yml pattern).
#
# The Go version comes from the module's go.mod (go and toolchain lines).
name: go-check

on:
  workflow_call:
    inputs:
      working-directory:
        description: Module directory, relative to the repository root
        type: string
        default: "."
      runs-on:
        description: Runner label
        type: string
        default: hetzner
      golangci-lint-version:
        description: golangci-lint version
        type: string
        # renovate: datasource=github-releases depName=golangci/golangci-lint
        default: v2.14.0
      govulncheck-version:
        description: golang.org/x/vuln version
        type: string
        # renovate: datasource=go depName=golang.org/x/vuln
        default: v1.8.0
      gotestsum-version:
        description: gotest.tools/gotestsum version
        type: string
        # renovate: datasource=go depName=gotest.tools/gotestsum
        default: v1.13.0
      race:
        description: Run the tests with the race detector
        type: boolean
        default: true
      test-timeout:
        description: go test -timeout
        type: string
        default: 20m
      artifact-name:
        description: Name of the uploaded test report (unique per run)
        type: string
        default: go-test-report
      tools:
        description: >-
          Tools the tests run, one per line as "<mise.toml key> <Go package>"
          (for example "helm helm.sh/helm/v4/cmd/helm"). The test job installs
          each with go install, at the exact version the caller's mise.toml
          pins for that key, into its own $RUNNER_TEMP/bin, first on PATH.
          Empty: none.
        type: string
        default: ""
      mise-toml:
        description: The caller's mise.toml that pins the tools, relative to the repository root
        type: string
        default: mise.toml

permissions:
  contents: read

jobs:
  lint:
    name: Format, tidy, vet, lint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ inputs.working-directory }}

  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      # The tests' tools, each at the version the caller's mise.toml pins, in
      # this job's own $RUNNER_TEMP/bin. A self-hosted runner keeps ~/go/bin
      # from job to job, so a tool another job left there could otherwise
      # pass a test this job never installed it for, at any version.
      - name: Install the tests' tools (versions from mise.toml)
        if: inputs.tools != ''
        env:
          TOOLS: ${{ inputs.tools }}
          MISE_TOML: ${{ inputs.mise-toml }}
          # Prints [tools].<key>'s version from mise.toml: a string, or a
          # table's version.
          READ_VERSION: |
            import sys, tomllib
            with open(sys.argv[1], "rb") as f:
                tools = tomllib.load(f).get("tools", {})
            v = tools.get(sys.argv[2])
            if isinstance(v, dict):
                v = v.get("version")
            if not isinstance(v, str) or not v:
                sys.exit(f"{sys.argv[1]} pins no version for {sys.argv[2]!r} in [tools]")
            print(v)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          manifest="$GITHUB_WORKSPACE/$MISE_TOML"
          : > "$RUNNER_TEMP/go-check-tools"
          while read -r key pkg extra; do
            case "$key" in ''|'#'*) continue ;; esac
            if [ -z "$pkg" ] || [ -n "$extra" ]; then
              echo "::error::tools: want \"<mise.toml key> <Go package>\" on each line, got \"$key $pkg $extra\""; exit 1
            fi
            if ! [[ "$pkg" =~ ^[A-Za-z0-9._~/-]+$ ]]; then
              echo "::error::tools: $pkg is not a Go package path"; exit 1
            fi
            version=$(python3 -c "$READ_VERSION" "$manifest" "$key")
            # An exact version only: not latest, a prefix or a range.
            if ! [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
              echo "::error::tools: ${MISE_TOML} pins ${key} at \"${version}\", not an exact version"; exit 1
            fi
            version="v${version#v}"
            # go install names the binary after the package's last element,
            # or the one before a major-version suffix (/v4).
            name="${pkg##*/}"
            if [[ "$name" =~ ^v[0-9]+$ ]]; then rest="${pkg%/*}"; name="${rest##*/}"; fi
            GOBIN="$bin" go install "${pkg}@${version}"
            echo "$name $version $pkg" >> "$RUNNER_TEMP/go-check-tools"
          done <<< "$TOOLS"
          echo "$bin" >> "$GITHUB_PATH"
      - name: The tests' tools resolve to this job's install
        if: inputs.tools != ''
        run: |
          set -euo pipefail
          echo "### Tools on PATH for go test" >> "$GITHUB_STEP_SUMMARY"
          while read -r name version pkg; do
            got=$(command -v "$name" || true)
            if [ "$got" != "$RUNNER_TEMP/bin/$name" ]; then
              echo "::error::$name resolves to ${got:-nothing}, not this job's $RUNNER_TEMP/bin/$name"; exit 1
            fi
            echo "- \`$name\` $version (\`$pkg\`): \`$got\`" | tee -a "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/go-check-tools"
      # Shuffled and uncached; no retry-to-green.
      - name: go test
        env:
          RACE: ${{ inputs.race }}
          TEST_TIMEOUT: ${{ inputs.test-timeout }}
        run: |
          set -o pipefail
          flags=(-count=1 -shuffle=on -timeout "$TEST_TIMEOUT" -json)
          if [ "$RACE" = "true" ]; then flags+=(-race); fi
          go test "${flags[@]}" ./... | tee test-report.json
      - name: JUnit report
        if: always()
        env:
          GOTESTSUM_VERSION: ${{ inputs.gotestsum-version }}
        run: |
          if [ -f test-report.json ]; then
            go run "gotest.tools/gotestsum@${GOTESTSUM_VERSION}" --junitfile test-report.xml \
              --raw-command cat test-report.json > /dev/null
          fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ inputs.working-directory }}/test-report.json
            ${{ inputs.working-directory }}/test-report.xml
          if-no-files-found: warn
          retention-days: 14

  vuln:
    name: govulncheck
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: govulncheck
        env:
          GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
